name: Auto Delete Vercel Project

on:
  workflow_dispatch:

jobs:
  delete-vercel-project:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Project from Vercel
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X DELETE \
            "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
          
          echo "API Response:"
          echo "$RESPONSE"
          
          # ステータスコードが 200 (成功) でない場合はエラーにして落とす
          if [[ "$RESPONSE" != *"HTTP_STATUS:200"* ]]; then
            echo "Failed to delete project on Vercel."
            exit 1
          fi